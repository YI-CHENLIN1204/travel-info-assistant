services:
  api:
    network_mode: host
    ports: !reset []
    environment:
      ConnectionStrings__Postgres: "Host=127.0.0.1;Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-travel_info};Username=${POSTGRES_USER:-travel_app};Password=${POSTGRES_PASSWORD:-local-development-only}"
      Redis__ConnectionString: "127.0.0.1:${REDIS_PORT:-6379}"

  web:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - /bin/sh
      - -c
      - |
        set -e
        sed -i 's|http://api:8080|http://host.docker.internal:${API_PORT:-8080}|' /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'